---
- name: Docker CIS Hardening Pipeline
  hosts: all
  become: yes
  tasks:
    - name: Create security reports directory
      file:
        path: /opt/security_reports
        state: directory

    - name: STEP 1 - Run OpenSCAP CIS Baseline Scan
      command: >
        oscap xccdf eval 
        --profile xccdf_org.ssgproject.content_profile_cis_level1_server 
        --results /opt/security_reports/baseline-results.xml 
        --report /opt/security_reports/docker_cis_baseline.html 
        /opt/scap-security-guide-0.1.79/ssg-ubuntu2204-ds.xml
      ignore_errors: yes

    # =================================================================
    # STEP 2: DOCKER HARDENING (Container-Native Remediation)
    # =================================================================
    - name: STEP 2A - Remove unnecessary network utilities (CIS compliance)
      apt:
        name: 
          - wget
          - curl
          - netcat
        state: absent

    - name: STEP 2B - Create a non-root application user
      user:
        name: appuser
        state: present
        shell: /bin/bash
        
    - name: Gather the package facts
      package_facts:
        manager: auto
      tags:
      - DISA-STIG-UBTU-22-215010
      - enable_strategy
      - low_complexity
      - low_disruption
      - medium_severity
      - no_reboot_needed
      - package_pam_pwquality_installed

    - name: Ensure libpam-pwquality is installed
      ansible.builtin.package:
        name: libpam-pwquality
        state: present
      when: '"libpam-runtime" in ansible_facts.packages'
      tags:
      - DISA-STIG-UBTU-22-215010
      - enable_strategy
      - low_complexity
      - low_disruption
      - medium_severity
      - no_reboot_needed
      - package_pam_pwquality_installed

    # =================================================================
    # STEP 3: POST-HARDENING SCAN
    # =================================================================
    - name: STEP 3 - Run OpenSCAP CIS Post-Hardening Scan
      command: >
        oscap xccdf eval 
        --profile xccdf_org.ssgproject.content_profile_cis_level1_server 
        --results /opt/security_reports/hardened-results.xml 
        --report /opt/security_reports/docker_cis_hardened.html 
        /opt/scap-security-guide-0.1.79/ssg-ubuntu2204-ds.xml
      ignore_errors: yes